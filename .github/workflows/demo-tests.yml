name: FinOps Demo Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINOPS_MODE: demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run complete local demo
        run: |
          python fetch_cost.py
          python alerts.py
          python report.py

      - name: Upload generated weekly CSV
        uses: actions/upload-artifact@v4
        with:
          name: finops-demo-weekly-report
          path: reports/weekly_usage_report.csv
          if-no-files-found: error
          retention-days: 7
